    .container {

        text-decoration: none;

        font-size: 17px;
        font-weight: bold;
        transition: all .3s ease;
    }

    .btn:hover {
        background: rgba(255,255,255,0.28);
        transform: translateX(8px);
        box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }

    .btn img {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #fff;
        padding: 5px;
    }

    .btn.text-btn {
        cursor: pointer;
        border: none;
        text-align: left;
    }

    /* 折叠区域 */
    .more-panel {
        display: none;
        flex-direction: column;
        gap: 14px;
        margin-top: 6px;
    }

    .toggle-more {
        justify-content: center;
        border-left-color: #ff9800;
    }

    /* 统计栏 */
    .stats {
        margin-top: 22px;
        font-size: 13px;
        opacity: .85;
        text-align: center;
        background: rgba(0,0,0,.35);
        padding: 10px 14px;
        border-radius: 12px;
    }

    /* 友链 */
    .friend-link {
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: bold;
        color: #fff;
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.25);
        backdrop-filter: blur(6px);
        text-decoration: none;
        transition: all .3s ease;
    }

    .friend-link img {
        width: 20px;
        height: 20px;
        border-radius: 50%;
    }

    .friend-link:hover {
        background: rgba(255,255,255,0.3);
        transform: translateY(-3px);
        box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }

    @media (max-width: 480px) {
        .btn { font-size: 15px; }
    }

    /* ===== 雪花容器与基础样式 ===== */
    #snow-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        overflow: hidden;
    }

    .snowflake {
        position: fixed;
        top: -30px;
        color: #fff;
        text-shadow: 0 0 5px rgba(180, 220, 255, 0.75);
        user-select: none;
        pointer-events: none;
        will-change: transform, opacity;
        animation-name: snowFall;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
    }

    @keyframes snowFall {
        0% {
            transform: translateY(0) rotate(0deg);
            opacity: 1;
        }
        100% {
            transform: translateY(115vh) rotate(360deg);
            opacity: 0.2;
        }
    }
</style>

<!-- 雪花飘落特效：持续飘落 + 鼠标吹散 + 点击爆炸（CSS 下落与 JS 互动完全解耦，不会越来越快） -->
<script>
(function () {
    var container = document.getElementById('snow-container');
    var SNOW_COUNT = 55;
    var chars = ['\u2744', '\u2745', '\u2746', '\u2022']; // ❄ ❅ ❆ •

    // ===== 1. 创建持续飘落的雪花 =====
    for (var i = 0; i < SNOW_COUNT; i++) {
        var flake = document.createElement('span');
        flake.className = 'snowflake';
        flake.innerText = chars[Math.floor(Math.random() * chars.length)];

        var size = Math.random() * 14 + 8;       // 8~22px
        var left = Math.random() * 100;           // 0~100vw
        var duration = Math.random() * 10 + 8;    // 8~18s 下落一周
        var delay = Math.random() * 18;           // 错开开始时间

        flake.style.left = left + 'vw';
        flake.style.fontSize = size + 'px';
        flake.style.opacity = (Math.random() * 0.5 + 0.4).toString();
        flake.style.animationDuration = duration + 's';
        // 负数延迟：动画立即从中间状态开始，页面一加载就满屏有雪
        flake.style.animationDelay = '-' + delay + 's';

        container.appendChild(flake);
    }

    // ===== 2. 鼠标吹散（用 margin 偏移，不碰 transform，与 CSS 下落动画零冲突）=====
    var mouseX = -9999, mouseY = -9999;

    document.addEventListener('mousemove', function (e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });
    document.addEventListener('mouseleave', function () {
        mouseX = -9999;
        mouseY = -9999;
    });

    function pushLoop() {
        var flakes = container.querySelectorAll('.snowflake');
        for (var i = 0; i < flakes.length; i++) {
            var flake = flakes[i];
            var rect = flake.getBoundingClientRect();
            var cx = rect.left + rect.width / 2;
            var cy = rect.top + rect.height / 2;
            var dx = cx - mouseX;
            var dy = cy - mouseY;
            var dist = Math.sqrt(dx * dx + dy * dy);
            var maxDist = 150;

            if (dist < maxDist && dist > 0) {
                var force = (1 - dist / maxDist) * 45;
                var angle = Math.atan2(dy, dx);
                flake.style.marginLeft = (Math.cos(angle) * force) + 'px';
                flake.style.marginTop  = (Math.sin(angle) * force) + 'px';
            } else {
                flake.style.marginLeft = '0px';
                flake.style.marginTop  = '0px';
            }
        }
        requestAnimationFrame(pushLoop);
    }
    pushLoop();

    // ===== 3. 点击屏幕爆一波雪花 =====
    document.addEventListener('click', function (e) {
        for (var i = 0; i < 9; i++) {
            (function (idx) {
                var burst = document.createElement('span');
                burst.className = 'snowflake';
                burst.innerText = chars[Math.floor(Math.random() * chars.length)];
                burst.style.left = e.clientX + 'px';
                burst.style.top  = e.clientY + 'px';
                burst.style.fontSize = (Math.random() * 12 + 8) + 'px';
                burst.style.animation = 'none'; // 爆炸粒子不走循环动画
                burst.style.opacity = '1';
                container.appendChild(burst);

                var angle = (Math.PI * 2 / 9) * idx;
                var velocity = Math.random() * 110 + 70;
                var vx = Math.cos(angle) * velocity;
                var vy = Math.sin(angle) * velocity;
                var x = 0, y = 0, rot = 0;

                function explode() {
                    x += vx * 0.016;
                    y += vy * 0.016;
                    vy += 1.6; // 重力
                    rot += 4;
                    burst.style.transform = 'translate(' + x + 'px, ' + y + 'px) rotate(' + rot + 'deg)';
                    burst.style.opacity = Math.max(0, parseFloat(burst.style.opacity) - 0.01);

                    if (parseFloat(burst.style.opacity) > 0) {
                        requestAnimationFrame(explode);
                    } else {
                        burst.remove();
                    }
                }
                requestAnimationFrame(explode);
            })(i);
        }
    });
})();
</script>
